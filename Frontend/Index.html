<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NAYAN AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e1b4b,
                #111827
            );
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            padding: 18px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status {
            font-size: 12px;
            color: #86efac;
            margin-top: 5px;
            font-weight: normal;
        }

        /* CHAT AREA */

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 85%;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.12);
            border-bottom-left-radius: 4px;
        }

        /* TYPING */

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-5px);
            }
        }

        /* INPUT AREA */

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            color: #111827;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 15px;
            cursor: pointer;
        }

        #sendBtn {
            background: #6366f1;
            color: white;
        }

        #voiceBtn {
            background: #22c55e;
            color: white;
            font-size: 18px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RETRY BUTTON */

        .retry-btn {
            margin-top: 8px;
            padding: 7px 12px;
            background: #ef4444;
            color: white;
            border-radius: 8px;
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                font-size: 21px;
                padding: 15px;
            }

            #chat {
                padding: 12px;
            }

            .message {
                max-width: 90%;
                font-size: 15px;
            }

            .input-area {
                padding: 8px;
            }

            #question {
                font-size: 15px;
                padding: 11px;
            }

            button {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        🤖 NAYAN AI

        <div class="status">
            ● Online
        </div>
    </header>


    <!-- CHAT -->

    <div id="chat">

        <div class="message ai">
            Hello! 👋
            <br>
            I am <b>NAYAN AI</b>.
            <br>
            Ask me anything.
        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <button
            id="voiceBtn"
            onclick="startVoice()"
            title="Voice input"
        >
            🎤
        </button>

        <input
            id="question"
            type="text"
            placeholder="Ask NAYAN AI..."
            autocomplete="off"
        >

        <button
            id="sendBtn"
            onclick="askNayan()"
        >
            Send
        </button>

    </div>
